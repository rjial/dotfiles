# foot terminal config.
# Copy/paste stays on the defaults (Ctrl+Shift+c / Ctrl+Shift+v) — xremap routes
# Super+C/V here, while a real Ctrl+C remains SIGINT.
[main]
# GohuFont = bitmap (strike diskrit 11px/14px saja) — WAJIB `:pixelsize=`, bukan
# `:size=` (point-size akan gagal match strike atau di-scale buram). Paket
# `gohufont` dipasang lewat ~/void-packages (lihat CLAUDE.md), bukan xbps resmi.
font=GohuFont:pixelsize=14, Symbols Nerd Font Mono:pixelsize=14
pad=5x5                     # margin 5px (horizontal x vertical)

[key-bindings]
# Defaults already: copy-clipboard=Control+Shift+c, paste-clipboard=Control+Shift+v
# (listed here for clarity; uncomment to pin explicitly)
# copy-clipboard=Control+Shift+c
# paste-clipboard=Control+Shift+v

# Catppuccin Frappé — github.com/catppuccin/foot
# [colors] DIGANTI [colors-dark] di foot >=1.17-ish (dukungan light/dark theme
# switch via SIGUSR1/SIGUSR2) — "[colors]" polos ditolak keras sbg
# "invalid section name" di foot 1.28.0, bukan sekadar deprecated/warning.
[colors-dark]
cursor=232634 f2d5cf
foreground=c6d0f5
background=303446

regular0=51576d
regular1=e78284
regular2=a6d189
regular3=e5c890
regular4=8caaee
regular5=f4b8e4
regular6=81c8be
regular7=b5bfe2

bright0=626880
bright1=e78284
bright2=a6d189
bright3=e5c890
bright4=8caaee
bright5=f4b8e4
bright6=81c8be
bright7=a5adce

16=ef9f76
17=f2d5cf

selection-foreground=c6d0f5
selection-background=4f5369

search-box-no-match=232634 e78284
search-box-match=c6d0f5 414559

jump-labels=232634 ef9f76
urls=8caaee
