# snappy-switcher — Alt+Tab / Cmd+Tab switcher ala macOS (Hyprland saja).
#
# Sumber kebenaran: ~/.dotfiles/config/snappy-switcher/config.ini
# `make link` men-symlink folder ini ke ~/.config/snappy-switcher/.
#
# Daemon dijalankan dari hyprland.conf: `exec-once = snappy-wrapper`.
# Keybind ada di config/hypr/hyprland.conf (Alt+Tab dan Super+Tab).
#
# CATATAN: hanya jalan di sesi Hyprland — snappy-switcher pakai Hyprland IPC
# untuk daftar window + urutan MRU. Di labwc/dwl daemon tak start (wrapper
# keluar karena socket Hyprland tak ada), keybind lama tetap dipakai.
#
# Tema TIDAK disalin ke sini. Binary mencari tema urut:
#   ~/.config/snappy-switcher/themes/  ->  /usr/share/...  ->  /usr/local/share/...
# `sudo make install` dari repo upstream menaruh tema di /usr/local/share/
# snappy-switcher/themes/, jadi fallback ketiga yang kepakai. Kalau mau
# custom tema: bikin folder themes/ di sini, file itu menang duluan.

[general]
# context = grup window per workspace+app (mirip Cmd+Tab macOS yg per-app),
# overview = tiap window kartu sendiri.
mode = context

# Panel muncul di monitor yang sedang difokus (bukan selalu monitor primary).
follow_monitor = true
show_workspace_badge = true

# false = tekan-lepas Alt+Tab langsung lompat ke window sebelumnya (perilaku
# macOS/Windows). true = kursor mulai di window aktif, butuh Tab kedua.
sticky_mode = false

# Window pinned (PiP mini-player) sudah tampil di semua workspace — cycling
# ke sana tak berguna. Tetap ditampilkan; ubah true kalau mengganggu.
ignore_pinned = false

[theme]
# Catppuccin Frappé — sinkron dgn foot, fuzzel, sfwbar, tema labwc.
name = catppuccin-frappe.ini

# Tema frappe upstream pakai aksen hijau mint. Repo ini pakai teal +
# surface2 (sama dgn col.active_border Hyprland), jadi di-override.
border_color = #81c8beff
badge_bg = #81c8beff
badge_text_color = #292c3cff

# Panel switcher membulat ala macOS, walau window Hyprland rounding = 0.
border_width = 2
corner_radius = 16

[layout]
card_width = 145
card_height = 135
card_gap = 10
padding = 12
max_cols = 6

icon_size = 57
icon_radius = 12

error_width = 480
error_height = 160
error_font_size = 13

[icons]
# Hanya Adwaita + hicolor yang terpasang di mesin ini. Kalau nanti pasang
# Papirus (`sudo dnf install papirus-icon-theme`), ganti `theme = Papirus`.
theme = Adwaita
fallback = hicolor
show_letter_fallback = true

[font]
# Sama dgn foot.ini & fuzzel.ini.
family = JetBrains Mono
weight = Bold
title_size = 10
icon_letter_size = 24
