# hyprland.conf — mirror keybind labwc rc.xml, tapi tiling + fitur Hyprland.
#
# KENDALA xremap (WAJIB DIBACA sebelum menambah keybind):
# xremap me-remap Super+<huruf> berikut menjadi Ctrl+ untuk shortcut GUI app:
#   a b c d e f g i j k l n o p r s t u v w x y z , - = backspace
#   + Shift-z Shift-t Shift-g
# Huruf itu TAK PERNAH sampai ke Hyprland. Yang tersisa untuk compositor:
#   q m h  space Return Tab grave  arrow  digit 0-9  period slash
#   bracketleft bracketright  Print  XF86*  dan semua kombinasi
#   Ctrl+Super+* / Alt+Super+* (xremap exact-match, jadi modifier tambahan lolos)
#
# Sumber kebenaran: ~/.dotfiles/config/hypr/hyprland.conf
# Deploy: cp -r config/hypr ~/.config/   (Hyprland auto-reload, tak perlu restart)

$mod  = SUPER
$term = foot
$menu = fuzzel

# ---------------------------------------------------------------- monitor
# Catch-all: berlaku untuk monitor apa pun (eDP-1, HDMI-A-1, DP-1, ...).
# Multi-monitor / resolusi-skala khusus: JANGAN edit sini — tulis di
# ~/.config/hypr/local.conf (di-source paling bawah file ini, tak di-track git).
monitor = , preferred, auto, 1

# Workspace 1-8 selalu ada. WAJIB untuk swipe 3 jari: Hyprland hanya
# menggeser ke workspace yang SUDAH ada (workspace_swipe_create_new = false),
# jadi tanpa persistent hanya workspace 1 yg eksis dan gesture tampak mati.
# Tanpa field `monitor:` = ikut monitor mana pun, jadi portabel antar mesin.
#
# defaultName = glyph nerd-font md-numeric_N_circle U+F0CA0 + 2*(N-1),
# HARUS sama dgn:
#   - labwc/rc.xml <desktops><names> (&#xf0ca0; dst)
#   - sfwbar.config label pager
# Kalau beda, pager sfwbar render dua set tombol: pin glyph (phantom) +
# workspace asli bernama "1".."8". Nama sama = satu set, bar identik antar WM.
workspace = 1, persistent:true, defaultName:󰲠
workspace = 2, persistent:true, defaultName:󰲢
workspace = 3, persistent:true, defaultName:󰲤
workspace = 4, persistent:true, defaultName:󰲦
workspace = 5, persistent:true, defaultName:󰲨
workspace = 6, persistent:true, defaultName:󰲪
workspace = 7, persistent:true, defaultName:󰲬
workspace = 8, persistent:true, defaultName:󰲮

# ---------------------------------------------------------------- env
# Mirror config/labwc/environment
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = MOZ_ENABLE_WAYLAND,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
# Chromium/Electron (Thorium, Helium, VSCode) native Wayland — memperbaiki
# address bar tak bisa diklik di WM wlroots saat jalan lewat XWayland.
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# JetBrains/Java di XWayland
env = _JAVA_AWT_WM_NONREPARENTING,1

# ---------------------------------------------------------------- autostart
# Mirror config/labwc/autostart — stack dibagi dgn labwc/dwl.
exec-once = lxpolkit                              # polkit agent (udisks mount)
exec-once = xremap ~/.config/xremap/config.yml    # Cmd->Ctrl remap
exec-once = ~/.local/bin/waypaper --restore       # wallpaper terakhir (swaybg)
                                                  # path absolut: ~/.local/bin belum
                                                  # tentu ada di PATH sesi SDDM
exec-once = sfwbar                                # menu-bar ala macOS
exec-once = mako                                  # notification daemon (toast
                                                  # kanan-atas, Catppuccin Frappé)
exec-once = snappy-wrapper                        # daemon snappy-switcher (Alt+Tab
                                                  # ala macOS). Wrapper menunggu
                                                  # socket Hyprland siap dulu, jadi
                                                  # tak balapan saat login SDDM.
exec-once = ~/.config/scripts/xdg-autostart       # entri XDG .desktop: nm-applet,
                                                  # blueman, spice-vdagent, slack.
                                                  # Buang entri lewat
                                                  # scripts/xdg-autostart.skip;
                                                  # XDG_CURRENT_DESKTOP=Hyprland
                                                  # sudah di-set di blok env atas.
# Pager sfwbar MELACAK workspace Hyprland (sfwbar 1.0~beta16 punya backend IPC
# Hyprland sendiri, tak butuh ext-workspace-v1). Syaratnya nama workspace sama
# dgn `pins` di sfwbar.config — lihat blok workspace di atas.

# ---------------------------------------------------------------- appearance
# Catppuccin Frappé — sinkron dgn labwc themerc + fuzzel + sfwbar.
general {
    gaps_in     = 3                               # labwc <gap>6</gap> = 6 antar window
    gaps_out    = 6
    border_size = 2
    # Border satu warna, persis labwc themerc (window.active/inactive.border.color)
    col.active_border   = rgba(626880ff)             # surface2
    col.inactive_border = rgba(414559ff)             # surface0
    layout      = dwindle
    resize_on_border = true                          # drag tepi tanpa modifier
    allow_tearing    = false
}

decoration {
    rounding = 0                                     # sudut tajam (labwc <cornerRadius>0)
    active_opacity   = 1.0
    inactive_opacity = 1.0
    # Hyprland 0.45+: shadow pindah ke subkategori decoration:shadow
    shadow {
        enabled      = true
        range        = 18
        render_power = 3
        color        = rgba(232634aa)                # crust
    }
    blur {
        enabled          = true
        size             = 6
        passes           = 3
        new_optimizations = true
        xray             = false
        noise            = 0.0117
        contrast         = 1.0
        brightness       = 0.9
        # popup/context menu (Electron, GTK, dll) ikut diblur Hyprland kalau
        # true — blur bleed di tepi rounded corner-nya kelihatan kayak margin.
        # false = menu tetap tajam, tanpa halo.
        popups           = false
    }
}

# Animasi ala macOS: cepat, ease-out, tanpa bouncing lebay.
animations {
    enabled = true
    bezier = macEase,   0.25, 0.1,  0.25, 1.0
    bezier = macOut,    0.16, 1.0,  0.3,  1.0
    animation = windows,       1, 4, macOut,  popin 92%
    animation = windowsOut,    1, 3, macEase, popin 92%
    animation = border,        1, 6, macEase
    animation = fade,          1, 4, macEase
    animation = workspaces,    1, 5, macOut,  slide
    animation = specialWorkspace, 1, 5, macOut, slidevert
}

dwindle {
    pseudotile     = true
    preserve_split = true
    smart_split    = false
}

misc {
    force_default_wallpaper   = 0                    # waypaper yang pegang wallpaper
    disable_hyprland_logo     = true
    disable_splash_rendering  = true
    focus_on_activate         = true
    vfr                       = true                 # hemat baterai
}

# ---------------------------------------------------------------- input
input {
    kb_layout    = us
    follow_mouse = 0                                 # click-to-focus (mac), sama dgn labwc
    float_switch_override_focus = 0
    touchpad {
        natural_scroll      = true                   # mac natural scroll
        tap-to-click        = true
        tap-and-drag        = true
        drag_lock           = true
        disable_while_typing = true
        scroll_factor       = 1.0
    }
}

# Fitur Hyprland: 3-finger swipe antar workspace = Mission Control-ish ala mac.
gestures {
    workspace_swipe                = true
    workspace_swipe_fingers        = 3
    workspace_swipe_distance       = 300
    workspace_swipe_invert         = true            # arah natural (mac)
    workspace_swipe_create_new     = false
    workspace_swipe_forever        = true
}

# ---------------------------------------------------------------- rules
windowrulev2 = float, class:^(lxpolkit)$
windowrulev2 = float, class:^(pavucontrol|nm-connection-editor|blueman-manager)$
windowrulev2 = float, title:^(Open File|Save File|Save As)$

# SourceGit (Avalonia, XWayland) memakai CSD: shadow + margin transparan dicat
# SENDIRI DI DALAM surface-nya. Geometri Hyprland normal (1904x1040 = layar -
# 2*(gaps_out+border)), jadi bukan gaps yang salah — padding gelap itu isi
# window. noblur menghentikan blur menembus margin transparan; noshadow
# mencegah shadow Hyprland dobel dgn shadow app.
windowrulev2 = noshadow, class:^([Ss]ource[Gg]it)$
windowrulev2 = noblur,   class:^([Ss]ource[Gg]it)$

# File picker portal (xdg-desktop-portal-gtk/kde, dipanggil app Plasma/GNOME)
# sama persis: CSD shadow dicat di dalam surface, sama kayak SourceGit di atas.
# noshadow hentikan Hyprland dobel-render shadow di atas punya app —
# margin transparan bawaan app sendiri tetap ada, tak bisa dibuang lewat rule.
# Match by class, BUKAN title — title portal ini ikut bahasa/aksi dialog
# ("Pilih folder untuk sesi lokal", dll), class-nya tetap "Xdg-desktop-portal-gtk".
windowrulev2 = float,    class:^([Xx]dg-desktop-portal-gtk)$
windowrulev2 = noshadow, class:^([Xx]dg-desktop-portal-gtk)$
windowrulev2 = noblur,   class:^([Xx]dg-desktop-portal-gtk)$
# Margin-nya sendiri baru hilang kalau app membuang CSD. Toolkit membuangnya
# saat maximized, tapi window ter-tile TIDAK dianggap maximized oleh klien X11.
# `fullscreenstate <internal> <client>`: internal 0 = tetap tile biasa,
# client 2 = klien dikabari "maximized". Buang komentar kalau setting
# native-frame di SourceGit tak tersedia/tak mempan.
# windowrulev2 = fullscreenstate 0 2, class:^([Ss]ource[Gg]it)$
# Bar transparan (sfwbar bg 303446dd) dpt blur asli Hyprland.
layerrule = blur, sfwbar
layerrule = ignorezero, sfwbar
layerrule = blur, launcher                            # fuzzel (layer-shell)
layerrule = ignorezero, launcher

# ---------------------------------------------------------------- keybind
# --- Launcher / terminal (mirror labwc) ---
bind = $mod,      SPACE,  exec, $menu
bind = ALT,       SPACE,  exec, $menu
bind = $mod,      RETURN, exec, $term

# --- Window management ---
bind = $mod,       Q,     killactive,
bind = $mod SHIFT, Q,     exit,
bind = $mod,       UP,    fullscreen, 1              # labwc ToggleMaximize (hormati bar)
bind = $mod SHIFT, UP,    fullscreen, 0              # fullscreen sejati
bind = $mod,       DOWN,  togglefloating,
bind = $mod,       LEFT,  movefocus, l
bind = $mod,       RIGHT, movefocus, r
# --- Window switcher (snappy-switcher) ---
# Flag `--mod` WAJIB sama dgn modifier di bind-nya. Kalau beda, snappy render
# banner CONFIG ERROR (dia menahan panel selama modifier ditekan; salah nama
# modifier = dia tak pernah lihat tombolnya ditahan).
# Alt+Tab  = semua window, urut MRU (Windows-style, dan Cmd+Tab macOS via xremap
#            TIDAK dipakai — Super+huruf dimakan xremap, Tab tidak, tapi Alt
#            lebih aman sebab tak bentrok remap apa pun).
bind = ALT,        TAB,   exec, snappy-switcher next --mod alt
bind = ALT SHIFT,  TAB,   exec, snappy-switcher prev --mod alt
# Super+Tab = hanya window di workspace aktif.
bind = $mod,       TAB,   exec, snappy-switcher next --workspace --mod super
bind = $mod SHIFT, TAB,   exec, snappy-switcher prev --workspace --mod super
# Fallback tanpa GUI (kalau daemon mati) — cycle langsung lewat Hyprland.
bind = $mod,       grave, cyclenext,
bind = $mod,       grave, bringactivetotop,

# Pengganti minimize (Hyprland tak punya iconify) — special workspace.
# labwc: Super+M / Super+H = Iconify.
bind = $mod,       M,     movetoworkspacesilent, special:minimized
bind = $mod,       H,     movetoworkspacesilent, special:minimized
bind = $mod SHIFT, M,     togglespecialworkspace, minimized

# Pindah posisi window dlm tiling
bind = $mod SHIFT, LEFT,  movewindow, l
bind = $mod SHIFT, RIGHT, movewindow, r
bind = $mod SHIFT, DOWN,  movewindow, d

# Resize (Super+minus/equal dipakai xremap untuk zoom app, jadi pakai Alt)
bind = $mod ALT,   LEFT,  resizeactive, -60 0
bind = $mod ALT,   RIGHT, resizeactive,  60 0
bind = $mod ALT,   UP,    resizeactive,  0 -40
bind = $mod ALT,   DOWN,  resizeactive,  0  40

# Layout dwindle
bind = $mod, PERIOD, togglesplit,                    # putar arah split
bind = $mod, SLASH,  pseudo,                         # pseudotile

# Notifikasi (mako). Pakai Ctrl+Super supaya xremap meloloskannya —
# Super+n / Super+d polos sudah dimakan xremap jadi Ctrl+n / Ctrl+d.
bind = CTRL $mod,       N, exec, makoctl dismiss              # tutup 1 notifikasi
bind = CTRL $mod SHIFT, N, exec, makoctl dismiss --all        # tutup semua
bind = CTRL $mod,       D, exec, makoctl mode -t do-not-disturb
bind = CTRL $mod SHIFT, D, exec, makoctl restore              # munculkan dari history

# Power menu (fuzzel) — sama di labwc (rc.xml C-W-q) dan dwl (config.h).
# Ctrl+Super karena $mod Q polos = killactive. Log Out di dalam menu memakai
# `loginctl terminate-session`, jadi lebih benar daripada `$mod SHIFT Q` (exit)
# di atas yang cuma membunuh compositor tanpa menutup sesi logind.
bind = CTRL $mod, Q, exec, ~/.config/scripts/powermenu

# Multi-monitor
bind = $mod,       BRACKETLEFT,  focusmonitor, -1
bind = $mod,       BRACKETRIGHT, focusmonitor, +1
bind = $mod SHIFT, BRACKETLEFT,  movecurrentworkspacetomonitor, -1
bind = $mod SHIFT, BRACKETRIGHT, movecurrentworkspacetomonitor, +1

# --- Workspaces (8 desktop = mac Spaces; labwc/rc.xml sama) ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
# 9 sengaja tak dipakai — sisakan kalau butuh slot khusus.

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8

# labwc SendToDesktop left/right
bind = CTRL $mod, LEFT,  movetoworkspace, r-1
bind = CTRL $mod, RIGHT, movetoworkspace, r+1
# Pindah workspace tanpa membawa window
bind = CTRL ALT,  LEFT,  workspace, r-1
bind = CTRL ALT,  RIGHT, workspace, r+1
# Scroll di area kosong / di atas bar = ganti workspace (fitur Hyprland)
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# --- Screenshot (mirror labwc, mac-style Cmd+Shift+3/4) ---
bind = $mod SHIFT,      3, exec, grim ~/Pictures/shot-$(date +%s).png
bind = $mod SHIFT,      4, exec, grim -g "$(slurp)" ~/Pictures/shot-$(date +%s).png
bind = CTRL $mod SHIFT, 3, exec, grim - | wl-copy -t image/png
bind = CTRL $mod SHIFT, 4, exec, grim -g "$(slurp)" - | wl-copy -t image/png
# Tombol PrtSc: default clipboard; + Ctrl = ke file
bind = ,           PRINT, exec, grim - | wl-copy -t image/png
bind = SHIFT,      PRINT, exec, grim -g "$(slurp)" - | wl-copy -t image/png
bind = CTRL,       PRINT, exec, grim ~/Pictures/shot-$(date +%s).png
bind = CTRL SHIFT, PRINT, exec, grim -g "$(slurp)" ~/Pictures/shot-$(date +%s).png

# --- Media key ---
# Lewat wrapper ~/.config/scripts/{volumectl,brightctl} supaya tiap perubahan
# memunculkan OSD (mako, kategori `osd`). Wrapper-lah yang memanggil wpctl/
# brightnessctl — jangan balik ke pemanggilan langsung, OSD-nya ikut hilang.
bindel = , XF86AudioRaiseVolume,   exec, ~/.config/scripts/volumectl up
bindel = , XF86AudioLowerVolume,   exec, ~/.config/scripts/volumectl down
bindl  = , XF86AudioMute,          exec, ~/.config/scripts/volumectl mute
bindl  = , XF86AudioMicMute,       exec, ~/.config/scripts/volumectl mic-mute
bindel = , XF86MonBrightnessUp,    exec, ~/.config/scripts/brightctl up
bindel = , XF86MonBrightnessDown,  exec, ~/.config/scripts/brightctl down

# --- Mouse (mirror dwl buttons[]) ---
bindm = $mod, mouse:272, movewindow                  # Super+LMB  = pindah
bindm = $mod, mouse:273, resizewindow                # Super+RMB  = resize
bind  = $mod, mouse:274, togglefloating,             # Super+MMB  = toggle float

# ---------------------------------------------------------------- local override
# Override per-mesin: monitor tambahan, resolusi/refresh/skala, posisi.
# File ini TIDAK di-track git — `make link` bikin kosong kalau belum ada,
# jadi `source` di bawah tak pernah error di mesin baru.
# Contoh isi local.conf:
#   monitor = eDP-1,   1920x1080@60, 0x0,    1
#   monitor = HDMI-A-1,1920x1080@60, 1920x0, 1
source = ~/.config/hypr/local.conf
